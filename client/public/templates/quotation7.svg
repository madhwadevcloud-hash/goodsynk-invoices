  <text x="240" y="152" font-family="Arial" font-size="8.5"><tspan font-weight="700">Quotation Date:</tspan> 16 Jul 2026</text>
  <text x="440" y="152" font-family="Arial" font-size="8.5"><tspan font-weight="700">Due Date:</tspan> 19 Jul 2026</text>
  
  <!-- Addresses Side by Side -->
  <text x="40" y="174" font-family="Arial" font-size="7.5" font-weight="700" fill="#444444">Customer Details:</text>
  <text x="40" y="186" font-family="Arial" font-size="8" font-weight="700" fill="#000000">Acme group</text>
  <text x="40" y="197" font-family="Arial" font-size="7.5" fill="#444444">Ph: XXXXXXXXX</text>
  <text x="40" y="208" font-family="Arial" font-size="7.5" fill="#444444">client@gmail.com</text>
  
  <text x="240" y="174" font-family="Arial" font-size="7.5" font-weight="700" fill="#444444">Billing Address:</text>
  <text x="240" y="186" font-family="Arial" font-size="7.5" fill="#444444">123</text>
  <text x="240" y="197" font-family="Arial" font-size="7.5" fill="#444444">ABCD, Karnataka</text>
  <text x="240" y="208" font-family="Arial" font-size="7.5" fill="#444444">XXXXXX</text>
  
  <text x="40" y="226" font-family="Arial" font-size="7.5"><tspan font-weight="700">Place of Supply:</tspan></text>
  <text x="40" y="238" font-family="Arial" font-size="8" font-weight="700">Karnataka</text>
  
  <!-- Items Table Header -->
  <line x1="40" y1="250" x2="555" y2="250" stroke="#B565D8" stroke-width="1.5"/>
  <text x="45" y="263" font-family="Arial" font-size="7.5" font-weight="700">#</text>
  <text x="70" y="263" font-family="Arial" font-size="7.5" font-weight="700">Item</text>
  <text x="280" y="263" text-anchor="end" font-family="Arial" font-size="7.5" font-weight="700">Rate / Item</text>
  <text x="330" y="263" text-anchor="middle" font-family="Arial" font-size="7.5" font-weight="700">Qty</text>
  <text x="400" y="263" text-anchor="end" font-family="Arial" font-size="7.5" font-weight="700">Taxable Value</text>
  <text x="475" y="263" text-anchor="end" font-family="Arial" font-size="7.5" font-weight="700">Tax Amount</text>
  <text x="550" y="263" text-anchor="end" font-family="Arial" font-size="7.5" font-weight="700">Amount</text>
  <line x1="40" y1="270" x2="555" y2="270" stroke="#B565D8" stroke-width="1.5"/>
  
  <!-- Row 1 -->
  <text x="45" y="286" font-family="Arial" font-size="7.5">1</text>
  <text x="70" y="286" font-family="Arial" font-size="7.5" font-weight="700">App</text>
  <text x="280" y="286" text-anchor="end" font-family="Arial" font-size="7.5">10,000.00</text>
  <text x="330" y="286" text-anchor="middle" font-family="Arial" font-size="7.5">1</text>
  <text x="400" y="286" text-anchor="end" font-family="Arial" font-size="7.5">10,000.00</text>
  <text x="475" y="286" text-anchor="end" font-family="Arial" font-size="7.5">400.00 (4%)</text>
  <text x="550" y="286" text-anchor="end" font-family="Arial" font-size="7.5">10,400.00</text>
  <line x1="40" y1="298" x2="555" y2="298" stroke="#e5e7eb" stroke-width="0.5"/>
  
  <!-- Totals Section -->
  <text x="440" y="318" text-anchor="end" font-family="Arial" font-size="7.5" font-weight="700">Taxable Amount</text>
  <text x="550" y="318" text-anchor="end" font-family="Arial" font-size="7.5" font-weight="700">₹10,000.00</text>
  
  <text x="440" y="330" text-anchor="end" font-family="Arial" font-size="7.5">CGST 2%</text>
  <text x="550" y="330" text-anchor="end" font-family="Arial" font-size="7.5">₹200.00</text>
  
  <text x="440" y="342" text-anchor="end" font-family="Arial" font-size="7.5">SGST 2%</text>
  <text x="550" y="342" text-anchor="end" font-family="Arial" font-size="7.5">₹200.00</text>
  
  <text x="440" y="360" text-anchor="end" font-family="Arial" font-size="11" font-weight="700">Total</text>
  <text x="550" y="360" text-anchor="end" font-family="Arial" font-size="11" font-weight="700" fill="#000000">₹10,400.00</text>
  
  <!-- Info Summary Bar -->
  <line x1="40" y1="375" x2="555" y2="375" stroke="#B565D8" stroke-width="0.75"/>
  <text x="40" y="386" font-family="Arial" font-size="7" fill="#444444">Total Items / Qty : 1 / 1</text>
  <text x="320" y="386" font-family="Arial" font-size="7" fill="#444444">Total Amount (in words): INR Ten Thousand Four Hundred Rupees Only</text>
  <line x1="40" y1="392" x2="555" y2="392" stroke="#B565D8" stroke-width="0.75"/>
  
  <!-- Signature Block -->
  <text x="480" y="440" text-anchor="middle" font-family="Arial" font-size="7" fill="#444444">For ABC Solutions Pvt. Ltd.</text>
  <!-- Signature Scribble -->
  <path d="M 450 465 Q 465 450 475 460 T 495 455 T 510 460" stroke="#111827" stroke-width="1.2" fill="none"/>
  <text x="480" y="478" text-anchor="middle" font-family="Arial" font-size="7" font-weight="700">Authorised Signatory</text>
  
  <!-- Seal Badge -->
  <rect x="455" y="490" width="50" height="18" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="2,2" rx="3"/>
  <text x="480" y="502" text-anchor="middle" font-family="Arial" font-size="6.5" font-weight="700" fill="#64748b">SAMPLE</text>
  
  <!-- Page Footer -->
  <line x1="40" y1="780" x2="555" y2="780" stroke="#B565D8" stroke-width="0.75"/>
  <text x="40" y="794" font-family="Arial" font-size="7" fill="#B565D8">Goodsynk Billing | Simple Invoicing, Billing &amp; Quotations | Visit: <tspan fill="#B565D8" font-weight="700">invoice.goodsynk.com</tspan></text>
  <text x="40" y="805" font-family="Arial" font-size="6.5" fill="#888888">Page 1/1 • This is a digitally signed document</text>
  
  <text x="555" y="792" text-anchor="end" font-family="Arial" font-size="6.5" fill="#888888">Powered By</text>
  <text x="555" y="802" text-anchor="end" font-family="Arial" font-size="8" font-weight="700" fill="#000000">GoodSynk</text>
  <text x="555" y="812" text-anchor="end" font-family="Arial" font-size="6.5" fill="#B565D8">Invoice.Receipt.Payment Receipts</text>
