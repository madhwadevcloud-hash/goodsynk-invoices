<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">
  <rect width="595" height="842" fill="#ffffff"/>
  
  <!-- Header Title -->
  <text x="40" y="55" font-family="Arial" font-size="24" font-weight="700" fill="#B565D8" letter-spacing="1.5">QUOTATION</text>
  
  <!-- Business Info -->
  <text x="40" y="75" font-family="Arial" font-size="11" font-weight="700" fill="#000000">ABC SOLUTIONS PVT. LTD.</text>
  <text x="40" y="89" font-family="Arial" font-size="7.5" fill="#444444">GSTIN: 29CXXXX1234F1Z5</text>
  <text x="40" y="101" font-family="Arial" font-size="7.5" fill="#444444">123, MG Road</text>
  <text x="40" y="113" font-family="Arial" font-size="7.5" fill="#444444">Bengaluru, Karnataka, 560001</text>
  <text x="40" y="125" font-family="Arial" font-size="7.5" fill="#444444"><tspan font-weight="700">Mobile:</tspan> 0000000000  <tspan font-weight="700">Email:</tspan> testuser@example.com</text>
  
  <!-- Logo Badge -->
  <rect x="515" y="40" width="40" height="40" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="535" y="64" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#B565D8">NS</text>
  
