<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842">
  <rect width="595" height="842" fill="#ffffff"/>
  
  <!-- Outer Page Border -->
  <rect x="25" y="25" width="545" height="792" fill="none" stroke="#111827" stroke-width="1.25"/>

  <!-- Header Box Divided into 3 Columns -->
  <line x1="25" y1="140" x2="570" y2="140" stroke="#111827" stroke-width="1"/>
  <line x1="260" y1="25" x2="260" y2="140" stroke="#111827" stroke-width="1"/>
  <line x1="415" y1="25" x2="415" y2="140" stroke="#111827" stroke-width="1"/>

  <!-- Col 1: Business Name -->
  <g transform="translate(45, 45)">
    <text x="0" y="28" font-family="Arial" font-size="11" font-weight="700" fill="#991B1B">Company Legal Solutions LLP</text>
    <text x="0" y="38" font-family="Arial" font-size="6.5" font-style="italic" fill="#4B5563">Continuum of actions of excellence...</text>
  </g>

  <!-- Col 2: Registered Office -->
  <g transform="translate(270, 38)" font-family="Times New Roman, serif">
    <text x="0" y="10" font-size="8.5" fill="#1E3A8A">Registered office</text>
    <text x="0" y="22" font-size="9" font-weight="700" fill="#111827">Company Legal Solutions</text>
    <text x="0" y="44" font-size="8.5" fill="#111827">AA302, Alpine Block, Bengaluru</text>
  </g>

  <!-- Col 3: Contact Info -->
  <g transform="translate(425, 38)" font-family="Times New Roman, serif">
    <text x="0" y="10" font-size="9" font-weight="700" fill="#111827">Ph: +91-94480 83714</text>
    <text x="0" y="22" font-size="8.5" fill="#111827">Email: sk@sklegal.com</text>
  </g>

  <!-- Purple Tint Banner -->
  <rect x="25" y="140" width="545" height="15" fill="#DDD6FE"/>
  <line x1="25" y1="155" x2="570" y2="155" stroke="#111827" stroke-width="1"/>

  <!-- Category & GSTIN Line -->
  <text x="45" y="172" font-family="Times New Roman, serif" font-size="9" fill="#111827">CATEGORY: Legal Services | SAC CODE: 998213/214</text>
  <text x="350" y="172" font-family="Times New Roman, serif" font-size="9" font-weight="700" fill="#111827">GSTIN: 29AFLFS718P1ZT</text>

  <!-- Centered Title -->
  <text x="297" y="210" text-anchor="middle" font-family="Times New Roman, serif" font-size="14" font-weight="700" fill="#111827">TAX INVOICE</text>

  <!-- 3-Column Metadata Box Grid -->
  <rect x="45" y="225" width="505" height="65" fill="none" stroke="#111827" stroke-width="1"/>
  <line x1="230" y1="225" x2="230" y2="290" stroke="#111827" stroke-width="1"/>
  <line x1="350" y1="225" x2="350" y2="290" stroke="#111827" stroke-width="1"/>

  <text x="50" y="235" font-family="Times New Roman, serif" font-size="8.5" fill="#111827">To,</text>
  <text x="50" y="245" font-family="Times New Roman, serif" font-size="8.5" font-weight="700" fill="#111827">Name of client company</text>
  <text x="235" y="235" font-family="Times New Roman, serif" font-size="8.5" fill="#111827">Kind Attention: Mr. XYZ</text>
  <text x="355" y="236" font-family="Times New Roman, serif" font-size="8.5" fill="#111827">Invoice No: SK/2026-00X</text>

  <!-- Ref Subject Line -->
  <text x="45" y="308" font-family="Times New Roman, serif" font-size="9" fill="#111827"><tspan font-weight="700">Ref:</tspan> Fees towards preparing and filing of a patent application.</text>

  <!-- Services Table Grid -->
  <rect x="45" y="325" width="505" height="185" fill="none" stroke="#111827" stroke-width="1"/>
  <line x1="45" y1="350" x2="550" y2="350" stroke="#111827" stroke-width="1"/>
  <line x1="450" y1="325" x2="450" y2="510" stroke="#111827" stroke-width="1"/>

  <text x="55" y="340" font-family="Times New Roman, serif" font-size="9.5" font-weight="700" fill="#111827">Description of Services</text>
  <text x="490" y="340" text-anchor="middle" font-family="Times New Roman, serif" font-size="8.5" font-weight="700" fill="#111827">Amount in Rs.</text>

  <g font-family="Times New Roman, serif" font-size="8.5" fill="#111827">
    <text x="65" y="376">a. Preparation of patent application No. 202541050681</text>
    <text x="535" y="376" text-anchor="end">25,000.00</text>
  </g>

  <!-- Summary Rows Inside Table -->
  <line x1="45" y1="455" x2="550" y2="455" stroke="#111827" stroke-width="1"/>
  <text x="50" y="466" font-family="Times New Roman, serif" font-size="8" font-weight="700" fill="#111827">INVOICE TOTAL (excluding GST on Reverse charge basis):</text>
  <text x="535" y="466" text-anchor="end" font-family="Times New Roman, serif" font-size="8.5" font-weight="700" fill="#111827">Rs. 25,000.00/-</text>

  <!-- Page Number Footer -->
  <text x="297" y="805" text-anchor="middle" font-family="Times New Roman, serif" font-size="9" fill="#111827">1</text>
</svg>
